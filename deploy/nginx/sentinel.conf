# Optional reverse proxy for Sentinel-FX.
#
# You do not need this. An SSH tunnel is simpler and has a smaller attack
# surface:
#     ssh -N -L 8088:127.0.0.1:8088 you@your-server
# then open http://127.0.0.1:8088 on your own machine.
#
# Use this file only if several people need the dashboard. If you do, mTLS is
# not optional: the application's own password + TOTP is the second layer, not
# the first. A client certificate means a stolen password alone is not enough.

server {
    listen 443 ssl;
    http2 on;
    server_name sentinel.example.com;

    ssl_certificate     /etc/letsencrypt/live/sentinel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentinel.example.com/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Client certificate authentication. Remove this block only if you have
    # something equally strong in front.
    ssl_client_certificate /etc/sentinel/ca.pem;
    ssl_verify_client on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The application sets its own CSP. Do not add a second one here: two CSP
    # headers are intersected, and the usual result is a blank dashboard.

    client_max_body_size 1m;

    # Login is the one endpoint worth rate-limiting at the edge as well as in
    # the app, because the app's own limiter needs a request to reach it first.
    location = /api/auth/login {
        limit_req zone=sentinel_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/proxy_params;
    }

    # The app's websocket route is /ws (main.py), not /api/stream. Proxying
    # the wrong path meant /ws fell through to `location /`, which sets no
    # Upgrade headers, so the handshake failed and the dashboard silently
    # lost live updates behind this config.
    location /ws {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        # The app binds sessions to a client fingerprint that includes the
        # source address. Forward the real one or every session will look
        # hijacked and be rejected.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

# In the http{} block:
# limit_req_zone $binary_remote_addr zone=sentinel_login:10m rate=5r/m;
#
# IMPORTANT: the app IGNORES X-Forwarded-For unless it is started with
# --trusted-proxy (or SENTINEL_TRUSTED_PROXY) naming this proxy's address.
# That is deliberate -- without it, any client reaching the port directly
# could choose its own apparent address. Start the engine with:
#     scripts/serve.py --trusted-proxy 127.0.0.1

server {
    listen 80;
    server_name sentinel.example.com;
    return 301 https://$host$request_uri;
}
