[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-fx"
version = "1.4.0"
description = "An autonomous FX trading agent built around capital preservation, statistical honesty and a tamper-evident audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sentinel-FX" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "pyotp>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Live venue adapters. Neither is needed for paper trading or research, and
# MetaTrader5 is a Windows-only wheel -- keep it out of the Linux image.
oanda = []
ccxt  = ["ccxt>=4.3"]
mt5   = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev   = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
sentinel-serve      = "scripts.serve:main"
sentinel-acceptance = "scripts.run_acceptance:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

# The bundled recurring-release schedule. Without this it is absent from an
# installed wheel and the calendar is empty at runtime while every test passes
# from the source tree.
[tool.setuptools.package-data]
"sentinel.news" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
